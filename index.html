<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minakshi Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ Clean Professional theme ============ */
:root{
  --bg:#f5f7fb;            /* app background */
  --surface:#ffffff;       /* cards / panels */
  --surface-2:#f9fafc;     /* subtle fill */
  --line:#e6e9f0;          /* borders */
  --txt:#1b2333;           /* primary text */
  --muted:#6b7488;         /* secondary text */
  --faint:#9aa2b2;         /* tertiary */
  --accent:#2f6bff;        /* primary blue */
  --accent-weak:#eaf1ff;   /* blue tint */
  --ok:#16a34a; --ok-bg:#e8f7ee;
  --warn:#d97706; --warn-bg:#fdf1e3;
  --err:#dc2626; --err-bg:#fdecec;
  --info:#0ea5e9; --info-bg:#e6f6fe;
  --radius:12px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.05);
  --sidebar:248px;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Jost',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#d4d9e3;border-radius:6px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--sidebar) 1fr;grid-template-rows:60px 1fr;min-height:100dvh;
     grid-template-areas:"side head" "side main"}
.header{grid-area:head;display:flex;align-items:center;justify-content:space-between;gap:12px;
     padding:0 22px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.sidebar{grid-area:side;background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;
     display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100dvh;overflow-y:auto}
.main{grid-area:main;padding:22px;overflow:auto}

/* ---------- brand / header ---------- */
.brand{display:flex;align-items:center;gap:11px;padding:6px 10px 14px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#2f6bff,#5b8cff);
     display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;box-shadow:0 6px 16px rgba(47,107,255,.3)}
.brand h1{font-size:16px;font-weight:600;letter-spacing:.2px}
.brand .sub{font-size:11.5px;color:var(--muted);margin-top:-1px}
.header .sectitle{font-size:16px;font-weight:600}
.header .right{display:flex;align-items:center;gap:8px}
.hbtn{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);
     display:flex;align-items:center;justify-content:center;color:var(--muted);transition:.15s}
.hbtn:hover{background:var(--surface-2);color:var(--txt)}
.menu-btn{display:none}

/* ---------- nav ---------- */
.nav-label{font-size:10.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);
     padding:14px 12px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--radius-sm);
     color:var(--muted);font-weight:500;font-size:14px;border:1px solid transparent;transition:.15s;width:100%;background:none;text-align:left}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.nav-item:hover{background:var(--surface-2);color:var(--txt)}
.nav-item.active{background:var(--accent-weak);color:var(--accent);border-color:#d7e3ff;font-weight:600}
.nav-item .count{margin-left:auto;font-size:11px;background:var(--surface-2);color:var(--muted);padding:1px 8px;border-radius:20px;border:1px solid var(--line)}
.nav-item.active .count{background:#fff;color:var(--accent);border-color:#d7e3ff}

/* ---------- page bits ---------- */
.page-head{margin-bottom:18px}
.page-head h2{font-size:20px;font-weight:600}
.page-head p{color:var(--muted);font-size:13.5px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat .lbl{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.stat .num{font-size:30px;font-weight:700;margin-top:6px;line-height:1}
.stat .ctx{font-size:12px;color:var(--faint);margin-top:4px}
.stat .ic{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:9px;background:var(--accent-weak);color:var(--accent);display:flex;align-items:center;justify-content:center}
.stat .ic svg{width:18px;height:18px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-head h3{font-size:14.5px;font-weight:600}
.card-body{padding:16px 18px}

/* two-column chat workspace */
.chatwrap{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
.conv-list{display:flex;flex-direction:column;max-height:70vh;overflow:auto}
.conv{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:.12s}
.conv:hover{background:var(--surface-2)}
.conv.active{background:var(--accent-weak)}
.conv .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.conv .name{font-weight:600;font-size:13.5px}
.conv .time{font-size:11px;color:var(--faint)}
.conv .last{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .role{font-size:11px;color:var(--accent);font-weight:500}

.thread{display:flex;flex-direction:column;height:70vh}
.thread-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.thread-head .nm{font-weight:600}
.thread-head .mt{font-size:12px;color:var(--muted)}
.thread-body{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.msg{max-width:74%;padding:9px 13px;border-radius:12px;font-size:13.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word;box-shadow:var(--shadow)}
.msg.in{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.out{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg .meta{font-size:10.5px;margin-top:4px;opacity:.75}
.thread-foot{padding:11px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--faint);text-align:center;background:var(--surface)}

/* table */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.search{flex:1;min-width:180px;position:relative}
.search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:14px;background:var(--surface);outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.search svg{position:absolute;left:11px;top:11px;width:16px;height:16px;color:var(--faint)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--surface-2);color:var(--muted);font-weight:600;font-size:11.5px;letter-spacing:.3px;text-transform:uppercase;position:sticky;top:0}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}

/* badges / buttons */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
.b-pass{background:var(--ok-bg);color:var(--ok)} .b-fail{background:var(--err-bg);color:var(--err)}
.b-none{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--radius-sm);border:1px solid var(--accent);
     background:var(--accent);color:#fff;font-size:13.5px;font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{background:#255ae0;border-color:#255ae0}
.btn svg{width:16px;height:16px}
.btn.ghost{background:var(--surface);color:var(--txt);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.danger{background:var(--err);border-color:var(--err)} .btn.danger:hover{background:#c41f1f}
.btn.ok{background:var(--ok);border-color:var(--ok)} .btn.ok:hover{background:#12873d}

/* editors */
.editrow{border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;background:var(--surface-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--surface);outline:none;color:var(--txt)}
.fld textarea{resize:vertical;min-height:52px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.mt{margin-top:10px}.right{text-align:right}.muted{color:var(--muted)}

/* empty state */
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .eic{width:52px;height:52px;border-radius:14px;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;color:var(--faint)}
.empty .eic svg{width:26px;height:26px}
.empty h4{font-size:15px;color:var(--txt);font-weight:600;margin-bottom:4px}
.empty p{font-size:13px}

/* guide */
.guide h4{font-size:14px;font-weight:600;margin:14px 0 6px;color:var(--txt)}
.guide p,.guide li{font-size:13.5px;color:var(--muted);line-height:1.7}
.guide ul{padding-left:18px}
.guide code{background:var(--surface-2);border:1px solid var(--line);padding:1px 6px;border-radius:5px;font-size:12.5px}

/* toast + loader */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(18px);background:#1b2333;color:#fff;
     padding:11px 18px;border-radius:10px;font-size:13px;z-index:1000;opacity:0;transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--err)} .toast.ok{background:var(--ok)}
.loader{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:1001;transition:width .3s}
.loader.on{width:80%}

.foot{margin-top:24px;text-align:center;color:var(--faint);font-size:12px}
.scrim{display:none}

/* ---------- responsive ---------- */
@media(max-width:980px){ .chatwrap{grid-template-columns:1fr} .thread{height:auto;min-height:48vh} }
@media(max-width:760px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:-280px;top:0;width:260px;z-index:60;transition:left .22s;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  .sidebar.open{left:0}
  .menu-btn{display:flex}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(10,15,25,.4);z-index:55}
  .header .sectitle{display:none}
  .grid3{grid-template-columns:1fr} .grid2{grid-template-columns:1fr}
}
@media print{ .sidebar,.header,.toolbar,.foot{display:none} .main{padding:0} }
</style>
</head>
<body>
<div class="loader" id="loader"></div>
<div class="toast" id="toast"></div>
<div class="scrim" id="scrim" onclick="closeNav()"></div>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">M</div><div><h1>Minakshi</h1><div class="sub">SP Honda, Purulia</div></div></div>
    <div class="nav-label">Workspace</div>
    <nav id="nav"></nav>
    <div style="margin-top:auto;padding:12px 10px;font-size:11.5px;color:var(--faint)">Built by Somnath Karmakar</div>
  </aside>

  <!-- HEADER -->
  <header class="header">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="hbtn menu-btn" onclick="openNav()" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="sectitle" id="sectitle">Live Chat</div>
    </div>
    <div class="right">
      <button class="hbtn" title="Refresh" onclick="refresh()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main" id="view"></main>
</div>

<script>
var API="https://script.google.com/macros/s/AKfycbzry_ud_Q_fppifmtzrv5I3--aVEG4UGudWoerrP7PEZlVrrJlzWZSCfJc1gQBV7JCH/exec";
var D=null, TAB="chat", ACTIVE_CONV=null, SEARCH="";
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"})[c]})}
function showL(){$("loader").classList.add("on")} function hideL(){$("loader").classList.remove("on")}
function toast(m,t){var e=$("toast");e.textContent=m;e.className="toast show "+(t||"");setTimeout(function(){e.className="toast "+(t||"")},2800)}
function api(p){showL();return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p)})
  .then(function(r){return r.json()}).then(function(d){hideL();return d}).catch(function(e){hideL();toast("Network error","err");throw e})}
function openNav(){$("sidebar").classList.add("open");$("scrim").classList.add("show")}
function closeNav(){$("sidebar").classList.remove("open");$("scrim").classList.remove("show")}

/* ------ icons (Lucide-style) ------ */
var IC={
 chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
 users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
 posts:'<path d="M20 7h-9M14 17H5M17 3v6M7 15v6"/><circle cx="17" cy="7" r="3"/><circle cx="7" cy="17" r="3"/>',
 faq:'<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/>',
 set:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
 guide:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
 search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>',
 file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
 download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
 inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>'
};
function svg(name){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(IC[name]||"")+'</svg>'}

var TABS=[["chat","Live Chat","chat"],["appl","Applicants","users"],["posts","Posts & Questions","posts"],["faq","FAQ","faq"],["set","Settings","set"],["help","Guide","guide"]];
function buildNav(){
  $("nav").innerHTML=TABS.map(function(t){
    var cnt="";
    if(t[0]==="appl"&&D)cnt='<span class="count">'+(D.stats.total||0)+'</span>';
    return '<button class="nav-item '+(t[0]===TAB?"active":"")+'" onclick="go(\''+t[0]+'\')">'+svg(t[2])+'<span>'+t[1]+'</span>'+cnt+'</button>';
  }).join("");
}
function go(t){TAB=t;ACTIVE_CONV=null;buildNav();$("sectitle").textContent=(TABS.find(function(x){return x[0]===t})||["","Live Chat"])[1];closeNav();render()}

function refresh(){return api({action:"dash"}).then(function(d){if(!d.ok){toast(d.error||"Error","err");return}D=d;buildNav();render()})}

function render(){
  if(TAB==="chat")renderChat();
  else if(TAB==="appl")renderAppl();
  else if(TAB==="posts")renderPosts();
  else if(TAB==="faq")renderFaq();
  else if(TAB==="set")renderSet();
  else renderHelp();
}

/* ---------------- LIVE CHAT ---------------- */
function groupConvs(){
  var g={};(D.chatlog||[]).forEach(function(r){var id=r["Chat ID"]||r["WA Number"]||"?";(g[id]=g[id]||[]).push(r)});
  return g;
}
function roleOf(num){
  var a=(D.applicants||[]).find(function(x){return String(x["WA Number"]||"")===String(num)||String(x["Chat ID"]||"").indexOf(num)>=0});
  return a?(a.Post||""):"";
}
function renderChat(){
  var g=groupConvs(), ids=Object.keys(g);
  var h='<div class="page-head"><h2>Recruitment Overview</h2><p>Live candidate conversations handled by Minakshi.</p></div>';
  h+='<div class="stats">'
    +statCard("Total Applicants",D.stats.total||0,"All time","users")
    +statCard("Today",D.stats.today||0,"New today","inbox")
    +statCard("Active Chats",ids.length,"Conversations","chat")+'</div>';

  if(!ids.length){ h+=card("Recent Conversations", emptyState("inbox","No conversations yet","Jab candidate Minakshi ko message karenge, yahan live dikhega.")); $("view").innerHTML=h; return; }

  if(!ACTIVE_CONV||!g[ACTIVE_CONV])ACTIVE_CONV=ids[0];
  // conversation list
  var list="";
  ids.forEach(function(id){
    var arr=g[id], last=arr[arr.length-1], num=(arr[0]["WA Number"]||id).replace(/@.*$/,"");
    var role=roleOf(num);
    list+='<div class="conv '+(id===ACTIVE_CONV?"active":"")+'" onclick="openConv(\''+esc(id)+'\')">'
      +'<div class="top"><span class="name">'+esc(num)+'</span><span class="time">'+fmtT(last.Time,true)+'</span></div>'
      +(role?'<span class="role">'+esc(role)+'</span>':'')
      +'<span class="last">'+esc((last.Dir==="OUT"?"Minakshi: ":"")+(last.Text||""))+'</span></div>';
  });
  // active thread
  var arr=g[ACTIVE_CONV], num=(arr[0]["WA Number"]||ACTIVE_CONV).replace(/@.*$/,"");
  var body="";
  arr.forEach(function(m){
    var out=(m.Dir||"").toUpperCase()==="OUT";
    body+='<div class="msg '+(out?"out":"in")+'">'+esc(m.Text)+'<div class="meta">'+(out?"Minakshi":"Candidate")+' · '+fmtT(m.Time)+'</div></div>';
  });
  var thread='<div class="thread"><div class="thread-head"><div><div class="nm">'+esc(num)+'</div>'
    +'<div class="mt">'+(roleOf(num)||"Candidate")+'</div></div></div>'
    +'<div class="thread-body" id="tbody">'+body+'</div>'
    +'<div class="thread-foot">Read-only view · replies are sent automatically on WhatsApp</div></div>';

  h+='<div class="chatwrap">'
    +'<div class="card"><div class="card-head"><h3>Conversations</h3><span class="muted" style="font-size:12px">'+ids.length+'</span></div><div class="conv-list">'+list+'</div></div>'
    +'<div class="card">'+thread+'</div></div>';
  $("view").innerHTML=h;
  var tb=$("tbody"); if(tb)tb.scrollTop=tb.scrollHeight;
}
function openConv(id){ACTIVE_CONV=id;renderChat()}

/* ---------------- APPLICANTS ---------------- */
function renderAppl(){
  var a=D.applicants||[];
  var filtered=a.filter(function(r){
    if(!SEARCH)return true; var s=SEARCH.toLowerCase();
    return JSON.stringify(r).toLowerCase().indexOf(s)>=0;
  });
  var h='<div class="page-head"><h2>Applicants</h2><p>All candidates collected by Minakshi.</p></div>';
  h+='<div class="toolbar"><div class="search">'+svg("search")+'<input id="q" placeholder="Search name, phone, post..." value="'+esc(SEARCH)+'" oninput="SEARCH=this.value;renderAppl()"></div>'
    +'<button class="btn ghost" onclick="downloadReport()">'+svg("download")+' Hiring Report (PDF)</button></div>';

  if(!filtered.length){ h+=emptyState("users","No applicants"+(SEARCH?" match your search":" yet"),SEARCH?"Search badlo.":"Candidate apply karenge to yahan dikhenge."); $("view").innerHTML=h; refocus(); return; }

  h+='<div class="table-wrap"><table><thead><tr><th>Date</th><th>Name</th><th>Post</th><th>Phone</th><th>CV</th><th>Status</th><th>Action</th></tr></thead><tbody>';
  filtered.slice().reverse().forEach(function(r){
    var name=r.name||r.Name||"—", phone=r.phone||r.Phone||r["WA Number"]||"";
    var cv=r["CV Link"]?'<a href="'+esc(r["CV Link"])+'" target="_blank">View</a>':'<span class="muted">—</span>';
    var dec=(r.Decision||"").toLowerCase(), db=dec==="pass"?"b-pass":dec==="fail"?"b-fail":"b-none";
    h+='<tr><td class="muted">'+fmtT(r.Timestamp)+'</td><td><b>'+esc(name)+'</b></td><td>'+esc(r.Post||"")+'</td><td>'+esc(phone)+'</td><td>'+cv+'</td>'
      +'<td><span class="badge '+db+'">'+esc(r.Decision||"Pending")+'</span></td>'
      +'<td><button class="btn ok sm" onclick="passCand('+r.__row+')">Pass + Link</button></td></tr>';
  });
  h+='</tbody></table></div>';
  $("view").innerHTML=h; refocus();
}
function refocus(){var q=$("q");if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
function passCand(row){
  var link=prompt("Paste the link to send this candidate (interview form / location / meet):");
  if(link===null||!link.trim())return;
  api({action:"setdecision",rowIndex:row,decision:"Pass",link:link.trim()}).then(function(d){
    if(d.ok){toast("Marked Pass — Minakshi will send the link within a minute.","ok");refresh()} else toast(d.error||"Error","err");
  });
}

/* ------ PDF hiring report (print view) ------ */
function downloadReport(){
  var a=D.applicants||[], s=D.stats||{}, bp=s.byPost||{};
  var when=new Date().toLocaleString();
  var rows=a.slice().reverse().map(function(r){
    var name=r.name||r.Name||"—", phone=r.phone||r.Phone||r["WA Number"]||"";
    return '<tr><td>'+fmtT(r.Timestamp)+'</td><td>'+esc(name)+'</td><td>'+esc(r.Post||"")+'</td><td>'+esc(phone)+'</td><td>'+esc(r.Decision||"Pending")+'</td></tr>';
  }).join("");
  var postRows=Object.keys(bp).map(function(k){return '<tr><td>'+esc(k)+'</td><td style="text-align:right">'+bp[k]+'</td></tr>'}).join("");
  var html='<!doctype html><html><head><meta charset="utf-8"><title>Hiring Report — Minakshi</title>'
   +'<style>*{font-family:Jost,Arial,sans-serif}body{padding:28px;color:#1b2333}h1{font-size:20px;margin:0}'
   +'.sub{color:#6b7488;font-size:12px;margin:2px 0 18px}.kpis{display:flex;gap:14px;margin:0 0 18px}'
   +'.kpi{border:1px solid #e6e9f0;border-radius:10px;padding:12px 16px;min-width:120px}.kpi .n{font-size:24px;font-weight:700}.kpi .l{font-size:11px;color:#6b7488;text-transform:uppercase;letter-spacing:.5px}'
   +'table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}th,td{border:1px solid #e6e9f0;padding:7px 9px;text-align:left}th{background:#f5f7fb}'
   +'h3{font-size:14px;margin:20px 0 6px}.ft{margin-top:24px;color:#9aa2b2;font-size:11px;text-align:center}'
   +'@media print{button{display:none}}</style></head><body>'
   +'<div style="display:flex;justify-content:space-between;align-items:flex-end"><div><h1>SP Honda, Purulia — Hiring Report</h1>'
   +'<div class="sub">Generated by Minakshi · '+when+'</div></div>'
   +'<button onclick="window.print()" style="padding:8px 14px;border:0;background:#2f6bff;color:#fff;border-radius:8px;font-weight:600;cursor:pointer">Save as PDF</button></div>'
   +'<div class="kpis"><div class="kpi"><div class="n">'+(s.total||0)+'</div><div class="l">Total Applicants</div></div>'
   +'<div class="kpi"><div class="n">'+(s.today||0)+'</div><div class="l">Today</div></div>'
   +'<div class="kpi"><div class="n">'+Object.keys(bp).length+'</div><div class="l">Active Posts</div></div></div>'
   +'<h3>Applicants by Post</h3><table><thead><tr><th>Post</th><th style="text-align:right">Count</th></tr></thead><tbody>'+(postRows||'<tr><td colspan=2>—</td></tr>')+'</tbody></table>'
   +'<h3>All Applicants ('+a.length+')</h3><table><thead><tr><th>Date</th><th>Name</th><th>Post</th><th>Phone</th><th>Status</th></tr></thead><tbody>'+(rows||'<tr><td colspan=5>No applicants yet</td></tr>')+'</tbody></table>'
   +'<div class="ft">Minakshi · SP Honda Hiring · Built by Somnath Karmakar</div></body></html>';
  var w=window.open("","_blank");
  if(!w){toast("Allow pop-ups to generate the PDF","err");return}
  w.document.write(html); w.document.close(); setTimeout(function(){try{w.focus();w.print()}catch(e){}},400);
}

/* ---------------- POSTS & QUESTIONS ---------------- */
var JOBS=[],FIELDS=[];
function cloneJob(j){return{Post:j.Post||"",Aliases:j.Aliases||"",Location:j.Location||"",Openings:j.Openings||"",Active:j.Active||"yes"}}
function cloneField(f){return{Post:f.Post||"",Order:f.Order||"",Key:f.Key||"",Label_EN:f.Label_EN||"",Label_HI:f.Label_HI||"",Label_BN:f.Label_BN||"",Type:f.Type||"text",Options:f.Options||"",Required:f.Required||"yes"}}
function renderPosts(){
  JOBS=(D.jobs||[]).map(cloneJob); FIELDS=(D.fields||[]).map(cloneField);
  var h='<div class="page-head"><h2>Posts & Questions</h2><p>Open/close posts and edit the questions Minakshi asks.</p></div>';
  h+='<div class="card"><div class="card-head"><h3>Job Posts</h3><div style="display:flex;gap:8px"><button class="btn ghost sm" onclick="addJob()">'+svg("plus")+' Add</button><button class="btn sm" onclick="saveJobs()">Save Posts</button></div></div><div class="card-body" id="jobs"></div></div>';
  h+='<div style="height:14px"></div><div class="card"><div class="card-head"><h3>Questions</h3><div style="display:flex;gap:8px"><button class="btn ghost sm" onclick="addField()">'+svg("plus")+' Add</button><button class="btn sm" onclick="saveFields()">Save Questions</button></div></div><div class="card-body" id="fields"></div></div>';
  $("view").innerHTML=h; drawJobs(); drawFields();
}
function drawJobs(){
  $("jobs").innerHTML=JOBS.map(function(j,i){return '<div class="editrow"><div class="grid3">'
    +fi("JOBS",i,"Post","Post")+fi("JOBS",i,"Location","Location")+fi("JOBS",i,"Openings","Openings")+'</div>'
    +'<div class="grid2 mt">'+fi("JOBS",i,"Aliases","Aliases (comma)")+fsel("JOBS",i,"Active",["yes","no"],"Active")+'</div>'
    +'<div class="right mt"><button class="btn danger sm" onclick="delJob('+i+')">'+svg("trash")+' Delete</button></div></div>';
  }).join("")||'<div class="muted">No posts. Click Add.</div>';
}
function drawFields(){
  FIELDS.sort(function(a,b){return (a.Post+"").localeCompare(b.Post+"")||(Number(a.Order)||0)-(Number(b.Order)||0)});
  $("fields").innerHTML=FIELDS.map(function(f,i){return '<div class="editrow"><div class="grid3">'
    +fi("FIELDS",i,"Post","Post")+fi("FIELDS",i,"Order","Order")+fi("FIELDS",i,"Key","Key (name/phone)")+'</div>'
    +'<div class="grid3 mt">'+fi("FIELDS",i,"Label_EN","Question EN")+fi("FIELDS",i,"Label_HI","Question HI")+fi("FIELDS",i,"Label_BN","Question BN")+'</div>'
    +'<div class="grid3 mt">'+fsel("FIELDS",i,"Type",["text","number","choice","cv"],"Type")+fi("FIELDS",i,"Options","Options (choice)")+fsel("FIELDS",i,"Required",["yes","no"],"Required")+'</div>'
    +'<div class="right mt"><button class="btn danger sm" onclick="delField('+i+')">'+svg("trash")+' Delete</button></div></div>';
  }).join("")||'<div class="muted">No questions. Click Add.</div>';
}
function fi(arr,i,k,ph){var v=(arr==="JOBS"?JOBS:FIELDS)[i][k];return '<div class="fld"><label>'+ph+'</label><input value="'+esc(v)+'" oninput="('+arr+')['+i+'].'+k+'=this.value"></div>'}
function fsel(arr,i,k,opts,lbl){var cur=(arr==="JOBS"?JOBS:FIELDS)[i][k];return '<div class="fld"><label>'+lbl+'</label><select onchange="('+arr+')['+i+'].'+k+'=this.value">'+opts.map(function(o){return '<option '+(String(cur)===o?"selected":"")+'>'+o+'</option>'}).join("")+'</select></div>'}
function addJob(){JOBS.push(cloneJob({Active:"yes"}));drawJobs()} function delJob(i){JOBS.splice(i,1);drawJobs()}
function addField(){FIELDS.push(cloneField({Type:"text",Required:"yes"}));drawFields()} function delField(i){FIELDS.splice(i,1);drawFields()}
function saveJobs(){api({action:"savejobs",rows:JOBS}).then(function(d){d.ok?toast("Posts saved — bot updates in ~5 min.","ok"):toast(d.error||"Error","err")})}
function saveFields(){api({action:"savefields",rows:FIELDS}).then(function(d){d.ok?toast("Questions saved — bot updates in ~5 min.","ok"):toast(d.error||"Error","err")})}

/* ---------------- FAQ ---------------- */
var REPLIES=[];
function cloneRep(r){return{Keywords:r.Keywords||"",Reply_EN:r.Reply_EN||"",Reply_HI:r.Reply_HI||"",Reply_BN:r.Reply_BN||""}}
function renderFaq(){
  REPLIES=(D.replies||[]).map(cloneRep);
  var h='<div class="page-head"><h2>FAQ Auto-Replies</h2><p>Keyword-based instant answers Minakshi gives.</p></div>';
  h+='<div class="card"><div class="card-head"><h3>FAQ</h3><div style="display:flex;gap:8px"><button class="btn ghost sm" onclick="addRep()">'+svg("plus")+' Add</button><button class="btn sm" onclick="saveReps()">Save FAQ</button></div></div><div class="card-body" id="reps"></div></div>';
  $("view").innerHTML=h; drawReps();
}
function drawReps(){
  $("reps").innerHTML=REPLIES.map(function(r,i){return '<div class="editrow">'
    +'<div class="fld"><label>Keywords (comma: salary,kitna)</label><input value="'+esc(r.Keywords)+'" oninput="REPLIES['+i+'].Keywords=this.value"></div>'
    +'<div class="grid3 mt">'+rta(i,"Reply_EN","Reply EN")+rta(i,"Reply_HI","Reply HI")+rta(i,"Reply_BN","Reply BN")+'</div>'
    +'<div class="right mt"><button class="btn danger sm" onclick="delRep('+i+')">'+svg("trash")+' Delete</button></div></div>';
  }).join("")||'<div class="muted">No FAQ. Click Add.</div>';
}
function rta(i,k,lbl){return '<div class="fld"><label>'+lbl+'</label><textarea oninput="REPLIES['+i+'].'+k+'=this.value">'+esc(REPLIES[i][k])+'</textarea></div>'}
function addRep(){REPLIES.push(cloneRep({}));drawReps()} function delRep(i){REPLIES.splice(i,1);drawReps()}
function saveReps(){api({action:"savereplies",rows:REPLIES}).then(function(d){d.ok?toast("FAQ saved.","ok"):toast(d.error||"Error","err")})}

/* ---------------- SETTINGS ---------------- */
function renderSet(){
  var s=D.settings||{};
  var h='<div class="page-head"><h2>Settings</h2><p>Bot identity shown to candidates.</p></div>'
   +'<div class="card" style="max-width:520px"><div class="card-body">'
   +'<div class="fld"><label>Bot name (candidates see this)</label><input id="sName" value="'+esc(s.botName||"Minakshi")+'"></div>'
   +'<div class="fld mt"><label>Company / branch</label><input id="sCo" value="'+esc(s.company||"SP Honda, Purulia")+'"></div>'
   +'<div class="mt"><button class="btn" onclick="saveSet()">Save Settings</button></div>'
   +'<div class="muted mt" style="font-size:12px">Changes reach the bot within ~5 minutes.</div></div></div>';
  $("view").innerHTML=h;
}
function saveSet(){api({action:"savesettings",settings:{botName:$("sName").value.trim(),company:$("sCo").value.trim()}}).then(function(d){d.ok?toast("Settings saved.","ok"):toast(d.error||"Error","err")})}

/* ---------------- GUIDE ---------------- */
function renderHelp(){
  $("view").innerHTML='<div class="page-head"><h2>Guide</h2><p>How to run Minakshi day to day.</p></div>'
   +'<div class="card guide"><div class="card-body">'
   +'<h4>Live Chat</h4><p>See every candidate conversation and what Minakshi replied. Auto-refreshes. (Shows new messages only while the bot is running.)</p>'
   +'<h4>Applicants</h4><p>All candidates + CV. Click <b>Pass + Link</b> and paste a link → Minakshi sends it to that candidate within a minute. Use <b>Hiring Report (PDF)</b> for a printable summary.</p>'
   +'<h4>Posts & Questions</h4><p>Add/close posts (Active yes/no) and edit questions in EN/HI/BN. Type: text, number, choice (fill Options), cv. Save → bot updates in ~5 min.</p>'
   +'<h4>FAQ</h4><p>Keyword auto-replies in 3 languages.</p>'
   +'<h4>Settings</h4><p>Change the bot name / company.</p>'
   +'<h4>Keep the bot running</h4><ul><li>Hiring phone: always ON + internet + WhatsApp linked.</li><li>Office PC ON (Sleep: Never) for continuous.</li><li>If stopped: on the PC run <code>pm2 restart minakshi</code>. See TROUBLESHOOTING.md.</li><li>For true 24×7 without a PC: move to WhatsApp Cloud API.</li></ul>'
   +'</div></div>';
}

/* ---------------- helpers ---------------- */
function statCard(lbl,num,ctx,icon){return '<div class="stat"><div class="ic">'+svg(icon)+'</div><div class="lbl">'+lbl+'</div><div class="num">'+num+'</div><div class="ctx">'+ctx+'</div></div>'}
function card(title,inner){return '<div class="card"><div class="card-head"><h3>'+title+'</h3></div><div class="card-body">'+inner+'</div></div>'}
function emptyState(icon,title,msg){return '<div class="empty"><div class="eic">'+svg(icon)+'</div><h4>'+esc(title)+'</h4><p>'+esc(msg)+'</p></div>'}
function fmtT(t,short){ if(!t)return ""; var d=new Date(t); if(isNaN(d))return esc(String(t));
  return short? d.toLocaleDateString([],{day:"2-digit",month:"short"})+" "+d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})
              : d.toLocaleString([],{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}); }

/* boot + auto-refresh live chat */
buildNav(); refresh();
setInterval(function(){ if(TAB==="chat"){ api({action:"dash"}).then(function(d){if(d.ok){D=d; if(TAB==="chat")renderChat()}}); } },20000);
</script>
